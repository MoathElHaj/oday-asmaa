<!doctype html>
<html lang="ar" dir="rtl" translate="no" class="notranslate">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#4a0d1c">
<title>التحقق من الدعوة · عدي & أسماء</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Noto+Naskh+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bur:#5a1024;--bur-d:#45091a;--cream:#f4e7da;--rose:#d9a98a;--ok:#3f7a4a;--no:#a8423b}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{min-height:100vh;background:radial-gradient(ellipse at 50% 30%,#5a1427,#3a0b18 75%);color:var(--cream);font-family:"Noto Naskh Arabic",system-ui,sans-serif;
  display:flex;align-items:center;justify-content:center;padding:calc(24px + env(safe-area-inset-top)) 18px 24px}
.box{width:100%;max-width:400px;text-align:center}
h1{font:700 30px/1.4 "Aref Ruqaa",serif;color:var(--rose)}
.sub{opacity:.75;font-size:14px;margin-bottom:20px}
.card{background:rgba(255,255,255,.06);border:1px solid rgba(217,169,138,.4);border-radius:20px;padding:24px 20px}
input{width:100%;border:1px solid rgba(217,169,138,.5);background:rgba(255,255,255,.08);color:#fff;border-radius:12px;padding:13px 14px;font:17px inherit;font-family:inherit;outline:none;text-align:center}
button{margin-top:12px;width:100%;min-height:50px;border:0;border-radius:30px;background:linear-gradient(180deg,#e2c3a4,#b98a63);color:#3a0b18;font:700 17px inherit;font-family:inherit;cursor:pointer}
.err{min-height:22px;margin-top:10px;color:#ffb4a8;font-size:14px}
.res .badge{width:86px;height:86px;margin:0 auto 12px;border-radius:50%;display:grid;place-items:center;font-size:44px;color:#fff}
.res.ok .badge{background:var(--ok)} .res.bad .badge{background:var(--no)} .res.warn .badge{background:#b07a2f}
.res .status{font-size:20px;font-weight:700}
.res .name{margin-top:10px;font:700 34px/1.4 "Aref Ruqaa",serif;color:#fff}
.res .count{margin-top:6px;font-size:22px;color:var(--rose)}
.res .code{margin-top:10px;font:600 15px ui-monospace,Menlo,monospace;letter-spacing:3px;opacity:.7}
.again{margin-top:18px;background:transparent;border:1px solid rgba(217,169,138,.5);color:var(--cream)}
</style>
</head>
<body>
<div class="box">
  <h1>عدي & أسماء</h1>
  <p class="sub">التحقق من دعوات الضيوف عند الدخول</p>

  <!-- staff sign-in (same password as the replies dashboard) -->
  <form class="card" id="login" hidden>
    <input type="password" id="pw" placeholder="كلمة سر لوحة الردود" autocomplete="current-password" required>
    <button>دخول</button>
    <p class="err" id="err"></p>
  </form>

  <div class="card res" id="res" hidden>
    <div class="badge" id="badge"></div>
    <p class="status" id="status"></p>
    <p class="name" id="name"></p>
    <p class="count" id="count"></p>
    <p class="code" id="code"></p>
    <button class="again" id="again" type="button">تحقق من دعوة أخرى</button>
  </div>

  <form class="card" id="manual" hidden>
    <input id="mcode" placeholder="أدخل رقم الدعوة" maxlength="8" autocapitalize="characters" required>
    <button>تحقق</button>
  </form>
</div>

<script src="config.js"></script>
<script>
const API = (window.SITE && window.SITE.rsvpEndpoint) || '';
const $ = s => document.querySelector(s);
const ss = { get(){ try{ return sessionStorage.getItem('adm') || ''; }catch(e){ return ''; } }, set(v){ try{ sessionStorage.setItem('adm', v); }catch(e){} } };
let key = ss.get(), code = (new URLSearchParams(location.search).get('c') || '').trim().toUpperCase();

async function call(body){
  const r = await fetch(API, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({...body, key})});
  return r.json();
}
function show(id){ ['login','res','manual'].forEach(x=>$('#'+x).hidden = x !== id); }

async function check(c){
  code = c;
  const j = await call({action:'check', code:c});
  if(!j.ok && j.error === 'auth'){ ss.set(''); key = ''; show('login'); return; }
  const res = $('#res'); res.className = 'card res';
  $('#code').textContent = c;
  if(!j.found){
    res.classList.add('bad'); $('#badge').textContent = '✕'; $('#status').textContent = 'رقم الدعوة غير موجود';
    $('#name').textContent = ''; $('#count').textContent = '';
  } else if(j.noReply){
    res.classList.add('warn'); $('#badge').textContent = '?'; $('#status').textContent = 'مدعو، لكنه لم يؤكد الحضور';
    $('#name').textContent = j.name; $('#count').textContent = 'العدد المسموح: ' + j.allowed;
  } else if(!j.attending){
    res.classList.add('warn'); $('#badge').textContent = '!'; $('#status').textContent = 'هذا الضيف سجّل اعتذاره';
    $('#name').textContent = j.name; $('#count').textContent = '';
  } else {
    res.classList.add('ok'); $('#badge').textContent = '✓'; $('#status').textContent = 'دعوة مؤكدة';
    $('#name').textContent = j.name; $('#count').textContent = 'عدد الحضور: ' + j.count + (j.allowed ? ' من ' + j.allowed + ' مسموح' : '');
  }
  show('res');
}

$('#login').addEventListener('submit', async e => {
  e.preventDefault(); key = $('#pw').value; $('#err').textContent = '';
  const j = await call({action:'check', code: code || '-'}).catch(()=>({ok:false}));
  if(!j.ok){ $('#err').textContent = j.error === 'auth' ? 'كلمة السر غير صحيحة' : 'تعذّر الاتصال، حاول مرة أخرى'; return; }
  ss.set(key); code ? check(code) : show('manual');
});
$('#manual').addEventListener('submit', e => { e.preventDefault(); check($('#mcode').value.trim().toUpperCase()); });
$('#again').addEventListener('click', () => { $('#mcode').value = ''; show('manual'); });

if(!API) { show('login'); $('#err').textContent = 'لم يتم ضبط رابط السيرفر'; }
else if(!key) show('login');
else code ? check(code) : show('manual');
</script>
</body>
</html>
